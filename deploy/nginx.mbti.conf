server {
  listen 80 default_server;
  server_name 544834.xyz www.544834.xyz _;

  root /opt/mbti/dist;
  index index.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /images/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location /stickers/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2 default_server;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/544834.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/544834.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://544834.xyz$request_uri;
}

server {
  listen 443 ssl http2;
  server_name 544834.xyz www.544834.xyz;

  root /opt/mbti/dist;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/544834.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/544834.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MBTI_SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /images/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location /stickers/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
